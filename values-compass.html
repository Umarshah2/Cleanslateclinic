document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"8559f520-c3eb-43e3-892f-d727c04ec8aa\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================================\n   Clean Slate Clinic — Colour & Type Foundations\n   Source of truth: CSC Brand Manual 2025 + Claude_Design_System.fig\n   ----------------------------------------------------------------------------\n   Fonts are loaded via CDN below. To use:\n     <link rel=\"stylesheet\" href=\"colors_and_type.css\">\n   DM Sans + Delicious Handrawn → Google Fonts. Satoshi → Fontshare CDN.\n   ========================================================================== */\n\n/* Delicious Handrawn — self-hosted from the brand's uploaded font file (fonts/). */\n@font-face { font-family:'Delicious Handrawn'; font-weight:400; font-style:normal; font-display:swap; src:url(\"24c443a5-da78-40e4-a65d-fedefb7531cd\") format('truetype'); }\n\n/* DM Sans — self-hosted from the brand's uploaded font files (fonts/). */\n@font-face { font-family:'DM Sans'; font-weight:400; font-style:normal; font-display:swap; src:url(\"e7e6c23b-fb2e-4915-a189-a8d83f432468\") format('truetype'); }\n@font-face { font-family:'DM Sans'; font-weight:500; font-style:normal; font-display:swap; src:url(\"fbda06f3-00dc-416f-8271-8de9a737d758\") format('truetype'); }\n@font-face { font-family:'DM Sans'; font-weight:600; font-style:normal; font-display:swap; src:url(\"5794fe7b-9a56-40da-b7fc-9fa1c5f7feb1\") format('truetype'); }\n@font-face { font-family:'DM Sans'; font-weight:700; font-style:normal; font-display:swap; src:url(\"e4f6dee9-c2e2-434a-a4ea-735e7061be29\") format('truetype'); }\n@font-face { font-family:'DM Sans'; font-weight:400; font-style:italic; font-display:swap; src:url(\"3d271b40-49eb-46e0-8857-d41d656b7ab4\") format('truetype'); }\n\n/* Satoshi — self-hosted from the brand's uploaded font files (fonts/). */\n@font-face { font-family:'Satoshi'; font-weight:400; font-style:normal; font-display:swap;\n  src:url(\"00b68dff-0bc8-451f-9bd6-94d6e1383c9f\") format('woff2'), url(\"3247bfd6-ad6d-4dc9-9119-77cc09cf2e62\") format('woff'); }\n@font-face { font-family:'Satoshi'; font-weight:500; font-style:normal; font-display:swap;\n  src:url(\"34e1f4a7-af6b-4faf-812d-0f8151271ea0\") format('woff2'), url(\"71feb21c-8503-4cbb-8180-7a3fae2f72d6\") format('woff'); }\n@font-face { font-family:'Satoshi'; font-weight:700; font-style:normal; font-display:swap;\n  src:url(\"a7a36049-1fb1-49b6-856d-775c98a54140\") format('woff2'), url(\"ca9af775-65d3-4973-92c1-3fdf46edfa7c\") format('woff'); }\n@font-face { font-family:'Satoshi'; font-weight:400; font-style:italic; font-display:swap;\n  src:url(\"af64b8a3-4983-4401-968d-c766187ceec9\") format('woff2'), url(\"13f91661-cd31-4dd1-85bc-ad1cfadf5e43\") format('woff'); }\n@font-face { font-family:'Satoshi'; font-weight:500; font-style:italic; font-display:swap;\n  src:url(\"e89ff978-e464-4465-b16a-e8bf4ce58156\") format('woff2'), url(\"f8858ca9-615c-4b98-805c-69627606ca2c\") format('woff'); }\n@font-face { font-family:'Satoshi'; font-weight:700; font-style:italic; font-display:swap;\n  src:url(\"27d7e68f-ffd0-4e1a-ab50-9627b4434013\") format('woff2'), url(\"759ac602-53b6-4f9e-8d80-24fed5ea8aeb\") format('woff'); }\n\n:root {\n  /* ───────────────────────── PRIMARY PALETTE ─────────────────────────\n     70% of any layout should come from here, anchored on dark teal + teal. */\n  --csc-dark-teal:    #235053;   /* hero anchor, body text on light, headings  */\n  --csc-teal:         #3AA6A3;   /* primary accent, CTAs, links, active states  */\n  --csc-pale-teal:    #CDEBEF;   /* soft fills, selected pills, highlights      */\n  --csc-blue:         #547CBE;   /* secondary primary accent (used sparingly)   */\n  --csc-mid-blue:     #A6D0EF;   /* soft blue fills                             */\n\n  /* ───────────────────────── NEUTRAL PALETTE ─────────────────────────\n     Flexibility + readability in support of the primary palette. */\n  --csc-white:        #FFFFFF;\n  --csc-beige:        #FAF6F7;   /* default page background (warm off-white)    */\n  --csc-neutral-teal: #EEF8F8;   /* tinted section background / card fills      */\n  --csc-pale-blue:    #EAF7FE;   /* tinted section background (cool)            */\n\n  /* ──────────────────────── SECONDARY PALETTE ────────────────────────\n     ~30% — accents & call-outs ONLY. Never for body text. */\n  --csc-orange:       #E49F74;   /* warm accent: numbered steps, highlights     */\n  --csc-yellow:       #F4DE71;\n  --csc-green:        #C5DE95;\n  --csc-pale-orange:  #FBDFC7;\n  --csc-pale-yellow:  #F8EDBA;\n  --csc-pale-green:   #EDF2CB;\n\n  /* ──────────────────────────── SEMANTIC ─────────────────────────────\n     Text — always high contrast. Dark teal on light, white on dark. */\n  --csc-fg-1:        #235053;             /* primary text                       */\n  --csc-fg-2:        #3D5254;             /* secondary / supporting text         */\n  --csc-fg-3:        #7A9699;             /* muted, meta, captions               */\n  --csc-fg-on-dark:  #FFFFFF;             /* text on dark-teal backgrounds       */\n  --csc-fg-on-dark-2: rgba(255,255,255,0.66);\n\n  --csc-link:        #3AA6A3;\n  --csc-link-hover:  #235053;\n\n  /* Surfaces */\n  --csc-bg:          #FAF6F7;             /* page                                */\n  --csc-surface:     #FFFFFF;             /* cards on beige                      */\n  --csc-surface-tint:#EEF8F8;             /* tinted card / soft panel            */\n  --csc-surface-dark:#235053;             /* inverted sections                   */\n\n  /* Lines & hairlines */\n  --csc-rule:        rgba(35,80,83,0.12); /* dividers on light                   */\n  --csc-rule-strong: rgba(35,80,83,0.20);\n  --csc-rule-on-dark: rgba(255,255,255,0.16);\n  --csc-border:      rgba(35,80,83,0.16); /* input / card borders                */\n\n  /* Status (kept within brand hues where possible) */\n  --csc-danger:      #DC3545;             /* validation errors (from figma forms)*/\n  --csc-success:     #3AA6A3;\n  --csc-focus-ring:  rgba(58,166,163,0.45);\n\n  /* ─────────────────────────── GRADIENTS ─────────────────────────────\n     Subtle only. Always pair ONE gradient with a single solid colour.\n     Never overlap gradients. */\n  --csc-grad-teal:        linear-gradient(135deg, #3AA6A3 0%, #235053 100%); /* @kind color */\n  --csc-grad-teal-soft:   linear-gradient(135deg, #CDEBEF 0%, #3AA6A3 100%); /* @kind color */\n  --csc-grad-pale-cool:   linear-gradient(135deg, #EAF7FE 0%, #CDEBEF 100%); /* @kind color */\n  --csc-grad-pale-warm:   linear-gradient(135deg, #FBDFC7 0%, #F8EDBA 100%); /* @kind color */\n  --csc-grad-mist:        linear-gradient(180deg, #EEF8F8 0%, #FAF6F7 100%); /* @kind color */\n\n  /* ─────────────────────── TYPE — FAMILIES ───────────────────────────\n     Heading + Subheading 1  → DM Sans Bold, sentence case\n     Subheading 2            → Satoshi Regular, ALL CAPS\n     Body                    → Satoshi Regular, sentence case\n     Tertiary / accent       → Delicious Handrawn, sentence case, sparingly */\n  --csc-font-heading: 'DM Sans', system-ui, sans-serif;\n  --csc-font-body:    'Satoshi', 'DM Sans', system-ui, sans-serif;\n  --csc-font-accent:  'Delicious Handrawn', 'Bradley Hand', cursive;\n  --csc-font-ui:      'DM Sans', system-ui, sans-serif; /* numbers, badges, nav */\n\n  /* Weights */\n  --csc-w-regular: 400; /* @kind font */\n  --csc-w-medium:  500; /* @kind font */\n  --csc-w-semibold:600; /* @kind font */\n  --csc-w-bold:    700; /* @kind font */\n\n  /* Tracking — DM Sans display runs slightly tight; all-caps opens up */\n  --csc-track-display: -0.022em; /* @kind font */\n  --csc-track-tight:   -0.01em; /* @kind font */\n  --csc-track-caps:    0.14em; /* @kind font */\n\n  /* ─────────────────────── TYPE — SCALE (semantic) ───────────────────\n     Tuned for web/product. Decks/print scale up proportionally. */\n  --csc-display:     clamp(40px, 6vw, 72px);  /* @kind font */ /* hero */\n  --csc-h1:          clamp(34px, 4.4vw, 52px); /* @kind font */\n  --csc-h2:          clamp(28px, 3.4vw, 40px); /* @kind font */\n  --csc-h3:          clamp(22px, 2.4vw, 28px); /* @kind font */\n  --csc-h4:          20px; /* @kind font */\n  --csc-subhead-caps:14px;                     /* Satoshi all-caps eyebrow · @kind font */\n  --csc-body-lg:     19px; /* @kind font */\n  --csc-body:        17px; /* @kind font */\n  --csc-body-sm:     15px; /* @kind font */\n  --csc-caption:     13px; /* @kind font */\n\n  --csc-lh-tight:    1.1;    /* @kind font */ /* display / headings */\n  --csc-lh-snug:     1.3;    /* @kind font */\n  --csc-lh-body:     1.6;    /* @kind font */ /* body copy */\n\n  /* ───────────────────── RADIUS · SHADOW · SPACE ─────────────────────\n     Rounded shapes & soft edges = warmth + approachability. */\n  --csc-radius-xs:  6px;\n  --csc-radius-sm:  10px;\n  --csc-radius-md:  16px;\n  --csc-radius-lg:  24px;     /* cards                          */\n  --csc-radius-xl:  32px;     /* large feature panels           */\n  --csc-radius-pill:999px;    /* buttons, chips, pills          */\n\n  --csc-shadow-sm: 0 1px 3px rgba(35,80,83,0.06);\n  --csc-shadow-md: 0 8px 24px rgba(35,80,83,0.08);   /* default card    */\n  --csc-shadow-lg: 0 18px 48px rgba(35,80,83,0.12);  /* raised / hover  */\n  --csc-shadow-focus: 0 0 0 3px var(--csc-focus-ring);\n\n  /* 8px base spacing rhythm */\n  --csc-space-1: 4px;\n  --csc-space-2: 8px;\n  --csc-space-3: 12px;\n  --csc-space-4: 16px;\n  --csc-space-5: 24px;\n  --csc-space-6: 32px;\n  --csc-space-7: 48px;\n  --csc-space-8: 64px;\n  --csc-space-9: 96px;\n\n  --csc-maxw: 1200px;       /* content container · @kind spacing */\n  --csc-ease: cubic-bezier(0.4, 0.14, 0.3, 1); /* @kind other */ /* calm, gentle ease */\n}\n\n/* ============================================================================\n   SEMANTIC TYPE CLASSES — apply directly or copy into component styles.\n   ========================================================================== */\n.csc-display {\n  font-family: var(--csc-font-heading);\n  font-weight: var(--csc-w-bold);\n  font-size: var(--csc-display);\n  line-height: var(--csc-lh-tight);\n  letter-spacing: var(--csc-track-display);\n  color: var(--csc-fg-1);\n  text-wrap: balance;\n}\n.csc-h1 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-bold); font-size: var(--csc-h1); line-height: var(--csc-lh-tight); letter-spacing: var(--csc-track-display); color: var(--csc-fg-1); text-wrap: balance; }\n.csc-h2 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-bold); font-size: var(--csc-h2); line-height: var(--csc-lh-snug); letter-spacing: var(--csc-track-tight); color: var(--csc-fg-1); text-wrap: balance; }\n.csc-h3 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-medium); font-size: var(--csc-h3); line-height: var(--csc-lh-snug); letter-spacing: var(--csc-track-tight); color: var(--csc-fg-1); }\n.csc-h4 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-semibold); font-size: var(--csc-h4); line-height: var(--csc-lh-snug); color: var(--csc-fg-1); }\n\n/* Subheading 2 — Satoshi, ALL CAPS, tracked. Eyebrow / kicker. */\n.csc-eyebrow {\n  font-family: var(--csc-font-body);\n  font-weight: var(--csc-w-medium);\n  font-size: var(--csc-subhead-caps);\n  text-transform: uppercase;\n  letter-spacing: var(--csc-track-caps);\n  color: var(--csc-teal);\n}\n\n.csc-body-lg { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body-lg); line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-body    { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body);    line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-body-sm { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body-sm); line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-caption { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-caption); line-height: var(--csc-lh-snug); color: var(--csc-fg-3); }\n\n/* Tertiary accent — Delicious Handrawn. Sparingly, for warm call-outs only. */\n.csc-accent {\n  font-family: var(--csc-font-accent);\n  font-weight: 400;\n  color: var(--csc-teal);\n  font-size: 1.4em;\n  line-height: 1.1;\n}\n<\u002Fstyle>\n<style>/* ============================================================================\n   Clean Slate Clinic — Design System entry point\n   ----------------------------------------------------------------------------\n   Link this single file to pull in all foundations (colour, type, tokens).\n     <link rel=\"stylesheet\" href=\"styles.css\">\n   UI-kit component styles (ui_kits/*/styles.css) remain scoped to their kit\n   and are linked separately by those kits.\n   ========================================================================== */\n/* ============================================================================\n   Clean Slate Clinic — Colour & Type Foundations\n   Source of truth: CSC Brand Manual 2025 + Claude_Design_System.fig\n   ----------------------------------------------------------------------------\n   Fonts are loaded via CDN below. To use:\n     <link rel=\"stylesheet\" href=\"colors_and_type.css\">\n   DM Sans + Delicious Handrawn → Google Fonts. Satoshi → Fontshare CDN.\n   ========================================================================== */\n\n/* Delicious Handrawn — self-hosted from the brand's uploaded font file (fonts/). */\n@font-face { font-family:'Delicious Handrawn'; font-weight:400; font-style:normal; font-display:swap; src:url(\"24c443a5-da78-40e4-a65d-fedefb7531cd\") format('truetype'); }\n\n/* DM Sans — self-hosted from the brand's uploaded font files (fonts/). */\n@font-face { fon ted, meta, captions               */\n  --csc-fg-on-dark:  #FFFFFF;             /* text on dark-teal backgrounds       */\n  --csc-fg-on-dark-2: rgba(255,255,255,0.66);\n\n  --csc-link:        #3AA6A3;\n  --csc-link-hover:  #235053;\n\n  /* Surfaces */\n  --csc-bg:          #FAF6F7;             /* page                                */\n  --csc-surface:     #FFFFFF;             /* cards on beige                      */\n  --csc-surface-tint:#EEF8F8;             /* tinted card / soft panel            */\n  --csc-surface-dark:#235053;             /* inverted sections                   */\n\n  /* Lines & hairlines */\n  --csc-rule:        rgba(35,80,83,0.12); /* dividers on light                   */\n  --csc-rule-strong: rgba(35,80,83,0.20);\n  --csc-rule-on-dark: rgba(255,255,255,0.16);\n  --csc-border:      rgba(35,80,83,0.16); /* input / card borders                */\n\n  /* Status (kept within brand hues where possible) */\n  --csc-danger:      #DC3545;             /* validation errors (from figma forms)*/\n  --csc-success:     #3AA6A3;\n  --csc-focus-ring:  rgba(58,166,163,0.45);\n\n  /* ─────────────────────────── GRADIENTS ─────────────────────────────\n     Subtle only. Always pair ONE gradient with a single solid colour.\n     Never overlap gradients. */\n  --csc-grad-teal:        linear-gradient(135deg, #3AA6A3 0%, #235053 100%); /* @kind color */\n  --csc-grad-teal-soft:   linear-gradient(135deg, #CDEBEF 0%, #3AA6A3 100%); /* @kind color */\n  --csc-grad-pale-cool:   linear-gradient(135deg, #EAF7FE 0%, #CDEBEF 100%); /* @kind color */\n  --csc-grad-pale-warm:   linear-gradient(135deg, #FBDFC7 0%, #F8EDBA 100%); /* @kind color */\n  --csc-grad-mist:        linear-gradient(180deg, #EEF8F8 0%, #FAF6F7 100%); /* @kind color */\n\n  /* ─────────────────────── TYPE — FAMILIES ───────────────────────────\n     Heading + Subheading 1  → DM Sans Bold, sentence case\n     Subheading 2            → Satoshi Regular, ALL CAPS\n     Body                    → Satoshi Regular, sentence case\n     Tertiary / accent       → Delicious Handrawn, sentence case, sparingly */\n  --csc-font-heading: 'DM Sans', system-ui, sans-serif;\n  --csc-font-body:    'Satoshi', 'DM Sans', system-ui, sans-serif;\n  --csc-font-accent:  'Delicious Handrawn', 'Bradley Hand', cursive;\n  --csc-font-ui:      'DM Sans', system-ui, sans-serif; /* numbers, badges, nav */\n\n  /* Weights */\n  --csc-w-regular: 400; /* @kind font */\n  --csc-w-medium:  500; /* @kind font */\n  --csc-w-semibold:600; /* @kind font */\n  --csc-w-bold:    700; /* @kind font */\n\n  /* Tracking — DM Sans display runs slightly tight; all-caps opens up */\n  --csc-track-display: -0.022em; /* @kind font */\n  --csc-track-tight:   -0.01em; /* @kind font */\n  --csc-track-caps:    0.14em; /* @kind font */\n\n  /* ─────────────────────── TYPE — SCALE (semantic) ───────────────────\n     Tuned for web/product. Decks/print scale up proportionally. */\n  --csc-display:     clamp(40px, 6vw, 72px);  /* @kind font */ /* hero */\n  --csc-h1:          clamp(34px, 4.4vw, 52px); /* @kind font */\n  --csc-h2:          clamp(28px, 3.4vw, 40px); /* @kind font */\n  --csc-h3:          clamp(22px, 2.4vw, 28px); /* @kind font */\n  --csc-h4:          20px; /* @kind font */\n  --csc-subhead-caps:14px;                     /* Satoshi all-caps eyebrow · @kind font */\n  --csc-body-lg:     19px; /* @kind font */\n  --csc-body:        17px; /* @kind font */\n  --csc-body-sm:     15px; /* @kind font */\n  --csc-caption:     13px; /* @kind font */\n\n  --csc-lh-tight:    1.1;    /* @kind font */ /* display / headings */\n  --csc-lh-snug:     1.3;    /* @kind font */\n  --csc-lh-body:     1.6;    /* @kind font */ /* body copy */\n\n  /* ───────────────────── RADIUS · SHADOW · SPACE ─────────────────────\n     Rounded shapes & soft edges = warmth + approachability. */\n  --csc-radius-xs:  6px;\n  --csc-radius-sm:  10px;\n  --csc-radius-md:  16px;\n  --csc-radius-lg:  24px;     /* cards                          */\n  --csc-radius-xl:  32px;     /* large feature panels           */\n  --csc-radius-pill:999px;    /* buttons, chips, pills          */\n\n  --csc-shadow-sm: 0 1px 3px rgba(35,80,83,0.06);\n  --csc-shadow-md: 0 8px 24px rgba(35,80,83,0.08);   /* default card    */\n  --csc-shadow-lg: 0 18px 48px rgba(35,80,83,0.12);  /* raised / hover  */\n  --csc-shadow-focus: 0 0 0 3px var(--csc-focus-ring);\n\n  /* 8px base spacing rhythm */\n  --csc-space-1: 4px;\n  --csc-space-2: 8px;\n  --csc-space-3: 12px;\n  --csc-space-4: 16px;\n  --csc-space-5: 24px;\n  --csc-space-6: 32px;\n  --csc-space-7: 48px;\n  --csc-space-8: 64px;\n  --csc-space-9: 96px;\n\n  --csc-maxw: 1200px;       /* content container · @kind spacing */\n  --csc-ease: cubic-bezier(0.4, 0.14, 0.3, 1); /* @kind other */ /* calm, gentle ease */\n}\n\n/* ============================================================================\n   SEMANTIC TYPE CLASSES — apply directly or copy into component styles.\n   ========================================================================== */\n.csc-display {\n  font-family: var(--csc-font-heading);\n  font-weight: var(--csc-w-bold);\n  font-size: var(--csc-display);\n  line-height: var(--csc-lh-tight);\n  letter-spacing: var(--csc-track-display);\n  color: var(--csc-fg-1);\n  text-wrap: balance;\n}\n.csc-h1 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-bold); font-size: var(--csc-h1); line-height: var(--csc-lh-tight); letter-spacing: var(--csc-track-display); color: var(--csc-fg-1); text-wrap: balance; }\n.csc-h2 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-bold); font-size: var(--csc-h2); line-height: var(--csc-lh-snug); letter-spacing: var(--csc-track-tight); color: var(--csc-fg-1); text-wrap: balance; }\n.csc-h3 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-medium); font-size: var(--csc-h3); line-height: var(--csc-lh-snug); letter-spacing: var(--csc-track-tight); color: var(--csc-fg-1); }\n.csc-h4 { font-family: var(--csc-font-heading); font-weight: var(--csc-w-semibold); font-size: var(--csc-h4); line-height: var(--csc-lh-snug); color: var(--csc-fg-1); }\n\n/* Subheading 2 — Satoshi, ALL CAPS, tracked. Eyebrow / kicker. */\n.csc-eyebrow {\n  font-family: var(--csc-font-body);\n  font-weight: var(--csc-w-medium);\n  font-size: var(--csc-subhead-caps);\n  text-transform: uppercase;\n  letter-spacing: var(--csc-track-caps);\n  color: var(--csc-teal);\n}\n\n.csc-body-lg { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body-lg); line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-body    { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body);    line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-body-sm { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-body-sm); line-height: var(--csc-lh-body); color: var(--csc-fg-2); }\n.csc-caption { font-family: var(--csc-font-body); font-weight: var(--csc-w-regular); font-size: var(--csc-caption); line-height: var(--csc-lh-snug); color: var(--csc-fg-3); }\n\n/* Tertiary accent — Delicious Handrawn. Sparingly, for warm call-outs only. */\n.csc-accent {\n  font-family: var(--csc-font-accent);\n  font-weight: 400;\n  color: var(--csc-teal);\n  font-size: 1.4em;\n  line-height: 1.1;\n}\n\n<\u002Fstyle>\n<script src=\"17dbba23-e1b1-47c7-ae3d-ce4fa381d93d\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box}\n  html{-webkit-text-size-adjust:100%}\n  body{margin:0;background:var(--csc-beige)}\n  #cscPrint{display:none}\n  @media print{\n    @page{margin:14mm}\n    body{background:#fff}\n    [data-noprint]{display:none !important}\n    #cscPrint{display:block !important}\n    [data-compass-card]{box-shadow:none !important;border:none !important;padding:0 !important;background:#fff !important}\n    svg.csc-compass,.csc-clabel{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  }\n  @media(prefers-reduced-motion:reduce){*{transition:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:880px;margin:0 auto;padding:40px 22px 76px;font-family:var(--csc-font-body);color:var(--csc-fg-1)\">\n\n  <p data-noprint=\"\" style=\"font-family:var(--csc-font-body);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--csc-teal);margin:0 0 12px\">Values &amp; identity · Clean Slate<\u002Fp>\n  <h1 style=\"font-family:var(--csc-font-heading);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 14px;letter-spacing:var(--csc-track-display);color:var(--csc-fg-1)\">Your values compass<\u002Fh1>\n  <p data-noprint=\"\" style=\"font-size:19px;color:var(--csc-fg-2);max-width:58ch;margin:0 0 26px;line-height:1.6\">Set a bearing for the parts of your life that matter most. Name the single value that points each direction, then mark how on-course you're living by it right now.<\u002Fp>\n\n  <div data-noprint=\"\" style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n    <div style=\"flex:1;min-width:170px\"><label style=\"display:block;font-size:12px;color:var(--csc-fg-3);margin:0 0 5px;font-weight:500\">Your name (optional)<\u002Flabel><input type=\"text\" autocomplete=\"name\" value=\"{{ name }}\" onchange=\"{{ onName }}\" style=\"width:100%;border:1px solid var(--csc-border);border-radius:var(--csc-radius-sm);padding:10px 12px;font-family:inherit;font-size:14px;color:var(--csc-fg-1);background:var(--csc-surface)\" style-focus=\"outline:2px solid var(--csc-teal);outline-offset:1px\"><\u002Fdiv>\n    <div style=\"flex:1;min-width:170px\"><label style=\"display:block;font-size:12px;color:var(--csc-fg-3);margin:0 0 5px;font-weight:500\">Date<\u002Flabel><input type=\"text\" value=\"{{ date }}\" onchange=\"{{ onDate }}\" style=\"width:100%;border:1px solid var(--csc-border);border-radius:var(--csc-radius-sm);padding:10px 12px;font-family:inherit;font-size:14px;color:var(--csc-fg-1);background:var(--csc-surface)\" style-focus=\"outline:2px solid var(--csc-teal);outline-offset:1px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showGuide }}\" hint-placeholder-val=\"{{ true }}\">\n  <details data-noprint=\"\" open=\"{{ guideOpen }}\" style=\"background:var(--csc-surface);border:1px solid var(--csc-rule);border-radius:var(--csc-radius-lg);padding:4px 24px;margin-bottom:22px;box-shadow:var(--csc-shadow-md)\">\n    <summary onclick=\"{{ onGuideToggle }}\" style=\"cursor:pointer;list-style:none;padding:18px 0;font-family:var(--csc-font-heading);font-size:20px;font-weight:700;color:var(--csc-dark-teal);display:flex;align-items:center;gap:10px\">\n      <span>How to use your compass<\u002Fspan>\n      <span style=\"{{ chevronStyle }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--csc-teal)\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fsummary>\n    <div style=\"padding:0 0 22px\">\n      <p style=\"margin:0 0 16px;font-size:15px;color:var(--csc-fg-2);line-height:1.65\">A compass doesn't tell you where you've arrived — it tells you which way you're facing. This tool works the same way. Each direction is an area of life that matters to you, and the centre is <b style=\"color:var(--csc-fg-1);font-weight:700\">true north<\u002Fb>: living fully by what you care about.<\u002Fp>\n      <ol style=\"list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:13px\">\n        <li style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--csc-fg-2);line-height:1.55\"><span style=\"flex:none;width:26px;height:26px;border-radius:var(--csc-radius-pill);background:var(--csc-orange);color:var(--csc-dark-teal);font-family:var(--csc-font-heading);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center\">1<\u002Fspan><span style=\"padding-top:2px\">Look at each direction. Rename any of them, and add more, so they fit your life.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--csc-fg-2);line-height:1.55\"><span style=\"flex:none;width:26px;height:26px;border-radius:var(--csc-radius-pill);background:var(--csc-orange);color:var(--csc-dark-teal);font-family:var(--csc-font-heading);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center\">2<\u002Fspan><span style=\"padding-top:2px\">In each, name the <b style=\"color:var(--csc-fg-1);font-weight:700\">single most important value<\u002Fb> — the quality of action you want to show up with, not a goal you tick off.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--csc-fg-2);line-height:1.55\"><span style=\"flex:none;width:26px;height:26px;border-radius:var(--csc-radius-pill);background:var(--csc-orange);color:var(--csc-dark-teal);font-family:var(--csc-font-heading);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center\">3<\u002Fspan><span style=\"padding-top:2px\">Mark how on-course you're living by that value right now. The centre is true north; the rim is off course.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--csc-fg-2);line-height:1.55\"><span style=\"flex:none;width:26px;height:26px;border-radius:var(--csc-radius-pill);background:var(--csc-orange);color:var(--csc-dark-teal);font-family:var(--csc-font-heading);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center\">4<\u002Fspan><span style=\"padding-top:2px\">Notice the gaps. They aren't failures — they show where a small step would point you back toward north.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <p style=\"font-size:14px;color:var(--csc-fg-2);border-left:2px solid var(--csc-teal);padding-left:14px;margin:0;line-height:1.6\"><b style=\"color:var(--csc-fg-1);font-weight:700\">Value, not goal.<\u002Fb> \"Be a present, patient parent\" is a value — a direction you can always travel. \"Take the kids to the coast\" is a goal — a place you arrive. Name the direction.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdetails>\n  <\u002Fsc-if>\n\n  <div data-compass-card=\"\" style=\"background:var(--csc-surface);border-radius:var(--csc-radius-lg);padding:24px;box-shadow:var(--csc-shadow-md);margin-bottom:20px\">\n    <div style=\"position:relative;width:100%;max-width:400px;margin:4px auto 0;aspect-ratio:1\">\n      <svg ref=\"{{ compassRef }}\" onclick=\"{{ onCompassClick }}\" class=\"csc-compass\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"Your values compass. The centre is true north — living fully by your values. The rim is off course.\" style=\"width:100%;height:100%;display:block;touch-action:none;cursor:crosshair\">\n        <g>\n          <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"36\">\n            <line x1=\"{{ t.x1 }}\" y1=\"{{ t.y1 }}\" x2=\"{{ t.x2 }}\" y2=\"{{ t.y2 }}\" stroke=\"{{ t.stroke }}\" strokewidth=\"{{ t.width }}\"><\u002Fline>\n          <\u002Fsc-for>\n          <circle cx=\"200\" cy=\"200\" r=\"176\" fill=\"none\" stroke=\"rgba(35,80,83,0.16)\" strokewidth=\"1\"><\u002Fcircle>\n        <\u002Fg>\n        <g>\n          <sc-for list=\"{{ rings }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <circle cx=\"200\" cy=\"200\" r=\"{{ r.r }}\" fill=\"none\" stroke=\"rgba(35,80,83,0.10)\" strokewidth=\"1\"><\u002Fcircle>\n          <\u002Fsc-for>\n        <\u002Fg>\n        <g>\n          <sc-for list=\"{{ spokes }}\" as=\"sp\" hint-placeholder-count=\"4\">\n            <line x1=\"{{ sp.x1 }}\" y1=\"{{ sp.y1 }}\" x2=\"{{ sp.x2 }}\" y2=\"{{ sp.y2 }}\" stroke=\"{{ sp.stroke }}\" strokewidth=\"{{ sp.width }}\" strokeopacity=\"{{ sp.opacity }}\"><\u002Fline>\n          <\u002Fsc-for>\n        <\u002Fg>\n        <g>\n          <path d=\"{{ roseStar }}\" fill=\"var(--csc-dark-teal)\" opacity=\"0.92\"><\u002Fpath>\n          <circle cx=\"200\" cy=\"200\" r=\"3.4\" fill=\"#FFFFFF\"><\u002Fcircle>\n        <\u002Fg>\n        <g>\n          <sc-for list=\"{{ markers }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <g transform=\"{{ m.transform }}\" onclick=\"{{ m.onClick }}\" style=\"cursor:pointer\">\n              <circle r=\"{{ m.haloR }}\" fill=\"#FFFFFF\" opacity=\"0.95\"><\u002Fcircle>\n              <path d=\"{{ m.triPath }}\" fill=\"{{ m.fill }}\" stroke=\"{{ m.stroke }}\" strokewidth=\"{{ m.strokeW }}\"><\u002Fpath>\n            <\u002Fg>\n          <\u002Fsc-for>\n        <\u002Fg>\n      <\u002Fsvg>\n      <sc-for list=\"{{ labels }}\" as=\"lab\" hint-placeholder-count=\"4\">\n        <div class=\"csc-clabel\" style=\"{{ lab.style }}\">{{ lab.name }}<sc-if value=\"{{ lab.hasValue }}\" hint-placeholder-val=\"{{ false }}\"><small style=\"display:block;font-family:var(--csc-font-body);font-weight:400;font-size:10px;color:var(--csc-fg-3)\">{{ lab.value }}<\u002Fsmall><\u002Fsc-if><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-noprint=\"\" style=\"background:var(--csc-surface);border-radius:var(--csc-radius-lg);padding:24px;box-shadow:var(--csc-shadow-md);margin-bottom:20px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <sc-for list=\"{{ domains }}\" as=\"dom\" hint-placeholder-count=\"4\">\n        <div style=\"{{ dom.cardStyle }}\" onclick=\"{{ dom.onCardClick }}\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px\">\n            <span style=\"{{ dom.swatchStyle }}\"><\u002Fspan>\n            <input type=\"text\" value=\"{{ dom.name }}\" onchange=\"{{ dom.onName }}\" aria-label=\"Direction name\" style=\"flex:1;border:none;border-bottom:1px dashed var(--csc-rule);background:transparent;font-family:var(--csc-font-heading);font-size:17px;font-weight:600;color:var(--csc-fg-1);padding:2px;min-width:0\" style-focus=\"outline:none\">\n            <sc-if value=\"{{ dom.removable }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ dom.onRemove }}\" title=\"Remove this direction\" aria-label=\"Remove direction\" style=\"border:none;background:transparent;color:var(--csc-fg-3);line-height:1;cursor:pointer;padding:3px;border-radius:6px;display:flex\" style-hover=\"filter:brightness(0.6)\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <input type=\"text\" maxlength=\"64\" value=\"{{ dom.value }}\" onchange=\"{{ dom.onValue }}\" placeholder=\"Name your one core value here\" aria-label=\"Your single most important value\" style=\"width:100%;border:1px solid var(--csc-border);border-radius:var(--csc-radius-sm);padding:9px 11px;font-family:inherit;font-size:14px;color:var(--csc-fg-1);background:var(--csc-surface);margin-bottom:4px\" style-focus=\"outline:2px solid var(--csc-teal);outline-offset:1px\">\n          <p style=\"font-size:11px;color:var(--csc-fg-3);margin:0 0 12px\">One value only — the direction, not the destination.<span style=\"float:right;font-family:var(--csc-font-ui)\">{{ dom.charText }}<\u002Fspan><\u002Fp>\n          <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--csc-fg-3);font-family:var(--csc-font-body);margin:8px 0 2px\"><span>off course<\u002Fspan><span>true north<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"1\" max=\"10\" value=\"{{ dom.score }}\" onchange=\"{{ dom.onScore }}\" aria-label=\"How on-course are you living by this value right now?\" style=\"{{ dom.sliderStyle }}\">\n          <div style=\"{{ dom.scoreReadStyle }}\">{{ dom.score }}/10<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--csc-fg-3);margin-top:11px;font-family:var(--csc-font-body);letter-spacing:.04em;text-transform:uppercase\">One small step (optional)<\u002Fdiv>\n          <input type=\"text\" value=\"{{ dom.step }}\" onchange=\"{{ dom.onStep }}\" placeholder=\"e.g. phone away at dinner, three nights this week\" aria-label=\"One small step\" style=\"width:100%;border:none;border-top:1px dashed var(--csc-rule);padding:11px 2px 0;margin-top:8px;font-family:inherit;font-size:13px;color:var(--csc-fg-1);background:transparent\" style-focus=\"outline:none\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button onclick=\"{{ onAdd }}\" disabled=\"{{ addDisabled }}\" style=\"{{ addStyle }}\" style-hover=\"filter:brightness(0.96)\">{{ addLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div data-noprint=\"\" style=\"background:var(--csc-surface);border-radius:var(--csc-radius-lg);padding:24px;box-shadow:var(--csc-shadow-md)\">\n    <div style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap\">\n      <div style=\"font-family:var(--csc-font-heading);font-weight:700;font-size:48px;line-height:1;color:var(--csc-dark-teal)\">{{ pct }}%<\u002Fdiv>\n      <p style=\"font-size:15px;color:var(--csc-fg-2);max-width:44ch;margin:0;line-height:1.55\">{{ summaryTxt }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;margin-top:20px;flex-wrap:wrap\">\n      <button onclick=\"{{ onPrint }}\" style=\"font-family:var(--csc-font-heading);font-weight:600;font-size:14px;border:none;border-radius:var(--csc-radius-pill);padding:12px 22px;cursor:pointer;background-color:var(--csc-dark-teal);color:#fff\" style-hover=\"filter:brightness(0.9)\" style-active=\"transform:scale(.98)\">Print my results<\u002Fbutton>\n      <button onclick=\"{{ onReset }}\" style=\"font-family:var(--csc-font-heading);font-weight:600;font-size:14px;background:transparent;color:var(--csc-dark-teal);border:1.5px solid var(--csc-rule-strong);border-radius:var(--csc-radius-pill);padding:12px 22px;cursor:pointer\" style-hover=\"filter:brightness(0.9)\" style-active=\"transform:scale(.98)\">Start over<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p data-noprint=\"\" style=\"font-size:12px;color:var(--csc-fg-3);margin-top:14px\">Original Clean Slate build · pairs naturally with your Values Card Sort<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"cscPrint\" style=\"font-family:var(--csc-font-body);color:#000\">\n  <p style=\"font-size:12px;color:#444;margin:0 0 18px\">{{ prMeta }}<\u002Fp>\n  <ul style=\"list-style:none;padding:0;margin:14px 0 0\">\n    <sc-for list=\"{{ prList }}\" as=\"item\" hint-placeholder-count=\"4\">\n      <li style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #e3e3e3\">\n        <span style=\"width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px;background:{{ item.hex }}\"><\u002Fspan>\n        <div>\n          <div style=\"font-family:var(--csc-font-heading);font-weight:700;font-size:15px;color:#000\">{{ item.name }}<\u002Fdiv>\n          <sc-if value=\"{{ item.hasValue }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:14px;color:#222\">{{ item.value }}<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ item.noValue }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14px;color:#999;font-style:italic\">no value set<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font-family:var(--csc-font-ui);font-size:12px;color:#555;margin-top:3px\">{{ item.score }}/10 on course<\u002Fdiv>\n          <sc-if value=\"{{ item.hasStep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#333;margin-top:3px\">Next step: {{ item.step }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Ful>\n  <p style=\"font-size:10px;color:#777;margin-top:26px\">Clean Slate · Values Compass · a value is a direction you travel, not a destination you reach.<\u002Fp>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showGuide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;maxDirections&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:4,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  DEFAULTS = [\n    {name:\"Relationships & connection\", hex:\"#E49F74\"},\n    {name:\"Health & growth\",            hex:\"#3AA6A3\"},\n    {name:\"Work & purpose\",             hex:\"#547CBE\"},\n    {name:\"Play & leisure\",             hex:\"#C99A2E\"},\n  ];\n  EXTRA_HEX = [\"#8AAE57\",\"#7E6396\",\"#A85C7A\",\"#6E89A8\"];\n  MIN = 2; VAL_MAX = 64;\n  CX=200; CY=200; RMAX=150; RMIN=28; RLABEL=178;\n  compassRef = React.createRef();\n\n  freshDomains(){ return this.DEFAULTS.map((d,i)=>({id:\"d\"+i, name:d.name, hex:d.hex, value:\"\", score:5, step:\"\", removable:false})); }\n  state = {\n    domains: this.DEFAULTS.map((d,i)=>({id:\"d\"+i, name:d.name, hex:d.hex, value:\"\", score:5, step:\"\", removable:false})),\n    activeId:\"d0\", extraUsed:0, name:\"\", date:\"\", guideOpen:true\n  };\n  componentDidMount(){ this.setState({date:new Date().toLocaleDateString(undefined,{day:\"numeric\",month:\"long\",year:\"numeric\"})}); }\n\n  maxDirections(){ const m=this.props.maxDirections||6; return Math.max(this.MIN, Math.min(8, m)); }\n  angleFor(i,n){ return (-90 + i*(360/n)) * Math.PI/180; }\n  scoreToR(s){ return this.RMAX - ((s-1)/9)*(this.RMAX-this.RMIN); }\n  overall(domains){ return Math.round(domains.reduce((a,d)=>a+d.score,0)/domains.length*10); }\n\n  setTop = (k) => (e) => { const v=e.target.value; this.setState({[k]:v}); };\n  selectDomain = (id) => () => { this.setState({activeId:id}); };\n  cardClick = (id) => (e) => { const tag=e.target.tagName; if(tag===\"INPUT\"||tag===\"BUTTON\"||e.target.closest(\"button\"))return; this.setState({activeId:id}); };\n  setField = (id,field) => (e) => { const v=e.target.value; this.setState(s=>({domains:s.domains.map(d=>d.id===id?{...d,[field]:v}:d)})); };\n  setScore = (id) => (e) => { const v=+e.target.value; this.setState(s=>({activeId:id, domains:s.domains.map(d=>d.id===id?{...d,score:v}:d)})); };\n  markerClick = (id) => (e) => { e.stopPropagation(); this.setState({activeId:id}); };\n  onGuideToggle = (e) => { if(e) e.preventDefault(); this.setState(s=>({guideOpen:!s.guideOpen})); };\n\n  addDomain = () => {\n    this.setState(s => {\n      if(s.domains.length>=this.maxDirections()) return null;\n      const hex=this.EXTRA_HEX[s.extraUsed%this.EXTRA_HEX.length];\n      const id=\"x\"+Date.now();\n      return { domains:[...s.domains,{id,name:\"New direction\",hex,value:\"\",score:5,step:\"\",removable:true}], activeId:id, extraUsed:s.extraUsed+1 };\n    });\n  };\n  removeDomain = (id) => (e) => {\n    if(e) e.stopPropagation();\n    this.setState(s => {\n      if(s.domains.length<=this.MIN) return null;\n      const domains=s.domains.filter(d=>d.id!==id);\n      const activeId = s.activeId===id ? domains[0].id : s.activeId;\n      return {domains, activeId};\n    });\n  };\n\n  onCompassClick = (e) => {\n    const svg=this.compassRef.current; if(!svg) return;\n    const r=svg.getBoundingClientRect();\n    const x=(e.clientX-r.left)/r.width*400, y=(e.clientY-r.top)/r.height*400;\n    const dist=Math.hypot(x-this.CX, y-this.CY);\n    if(dist > this.RMAX+8) return;\n    let sc=Math.round(10-((Math.min(dist,this.RMAX)-this.RMIN)/(this.RMAX-this.RMIN))*9);\n    sc=Math.max(1,Math.min(10,sc));\n    const id=this.state.activeId;\n    this.setState(s=>({domains:s.domains.map(d=>d.id===id?{...d,score:sc}:d)}));\n  };\n\n  onPrint = () => { window.print(); };\n  onReset = () => { this.setState({ domains:this.freshDomains(), activeId:\"d0\", extraUsed:0 }); };\n\n  renderVals(){\n    const s = this.state;\n    const n = s.domains.length;\n    const MAX = this.maxDirections();\n\n    // static-ish furniture\n    const ticks=[];\n    for(let a=0;a<360;a+=10){\n      const major=a%90===0, rad=a*Math.PI/180;\n      const r1=major?this.RMAX+18:this.RMAX+22, r2=this.RMAX+26;\n      ticks.push({\n        x1:(this.CX+r1*Math.cos(rad)).toFixed(2), y1:(this.CY+r1*Math.sin(rad)).toFixed(2),\n        x2:(this.CX+r2*Math.cos(rad)).toFixed(2), y2:(this.CY+r2*Math.sin(rad)).toFixed(2),\n        stroke: major?\"var(--csc-dark-teal)\":\"rgba(35,80,83,0.22)\", width: major?1.6:1\n      });\n    }\n    const rings=[1,2,3,4].map(k=>({ r:(this.RMIN+(this.RMAX-this.RMIN)*k/4).toFixed(2) }));\n\n    const rosePts=[]; const big=this.RMIN, small=this.RMIN*0.42;\n    const roseStart=-Math.PI/2, roseStep=Math.PI/n;\n    for(let k=0;k<2*n;k++){ const ang=roseStart+k*roseStep, rr=(k%2===0)?big:small; rosePts.push((this.CX+rr*Math.cos(ang)).toFixed(1)+\",\"+(this.CY+rr*Math.sin(ang)).toFixed(1)); }\n    const roseStar = \"M\"+rosePts.join(\"L\")+\"Z\";\n\n    const spokes=[], markers=[], labels=[];\n    s.domains.forEach((d,i)=>{\n      const ang=this.angleFor(i,n), isA=d.id===s.activeId;\n      spokes.push({\n        x1:(this.CX+this.RMIN*Math.cos(ang)).toFixed(2), y1:(this.CY+this.RMIN*Math.sin(ang)).toFixed(2),\n        x2:(this.CX+this.RMAX*Math.cos(ang)).toFixed(2), y2:(this.CY+this.RMAX*Math.sin(ang)).toFixed(2),\n        stroke:d.hex, width:isA?2:1.4, opacity:isA?0.55:0.3\n      });\n      const r=this.scoreToR(d.score);\n      const mx=this.CX+r*Math.cos(ang), my=this.CY+r*Math.sin(ang);\n      const deg=(ang*180/Math.PI)+90;\n      const sz=isA?10.5:8.5;\n      markers.push({\n        transform:\"translate(\"+mx.toFixed(1)+\",\"+my.toFixed(1)+\") rotate(\"+deg.toFixed(1)+\")\",\n        haloR:isA?14:11.5,\n        triPath:\"M0,\"+(-sz)+\" L\"+(sz*0.78)+\",\"+(sz*0.7)+\" L\"+(-sz*0.78)+\",\"+(sz*0.7)+\" Z\",\n        fill:d.hex, stroke:isA?\"#FFFFFF\":\"none\", strokeW:isA?1.4:0,\n        onClick:this.markerClick(d.id)\n      });\n      const lx=(this.CX+this.RLABEL*Math.cos(ang))/400*100, ly=(this.CY+this.RLABEL*Math.sin(ang))/400*100;\n      labels.push({\n        style:\"position:absolute;left:\"+lx.toFixed(1)+\"%;top:\"+ly.toFixed(1)+\"%;transform:translate(-50%,-50%);font-family:var(--csc-font-heading);font-size:12px;font-weight:600;line-height:1.15;text-align:center;max-width:104px;pointer-events:none;text-wrap:balance;color:\"+d.hex,\n        name:d.name, value:d.value, hasValue:!!d.value\n      });\n    });\n\n    const cardBase = \"border:1px solid var(--csc-border);border-radius:var(--csc-radius-md);padding:14px 15px 15px;background:var(--csc-surface);cursor:pointer;\";\n    const domains = s.domains.map(d => {\n      const isA = d.id===s.activeId;\n      return {\n        id:d.id, name:d.name, hex:d.hex, value:d.value, score:d.score, step:d.step, removable:d.removable,\n        charText: d.value.length+\"/\"+this.VAL_MAX,\n        cardStyle: cardBase + (isA ? \"border-color:\"+d.hex+\";box-shadow:0 0 0 1px \"+d.hex+\" inset;\" : \"\"),\n        swatchStyle: \"width:12px;height:12px;border-radius:50%;flex:none;background:\"+d.hex,\n        sliderStyle: \"width:100%;accent-color:\"+d.hex+\";cursor:pointer;margin:0\",\n        scoreReadStyle: \"font-family:var(--csc-font-ui);font-size:12px;font-weight:600;text-align:center;margin-top:6px;color:\"+d.hex,\n        onCardClick:this.cardClick(d.id), onName:this.setField(d.id,\"name\"), onValue:this.setField(d.id,\"value\"),\n        onScore:this.setScore(d.id), onStep:this.setField(d.id,\"step\"), onRemove:this.removeDomain(d.id)\n      };\n    });\n\n    const addDisabled = n>=MAX;\n    const addBase = \"margin-top:14px;border:1px dashed var(--csc-border);font-family:var(--csc-font-heading);font-size:14px;font-weight:600;border-radius:var(--csc-radius-md);padding:12px;width:100%;cursor:pointer;background:transparent;\";\n    const addStyle = addBase + (addDisabled ? \"color:var(--csc-fg-3);opacity:.6;cursor:not-allowed;\" : \"color:var(--csc-teal);\");\n    const addLabel = addDisabled ? (\"Maximum of \"+MAX+\" directions\") : \"+ Add a direction\";\n\n    const pct = this.overall(s.domains);\n    const off = [...s.domains].sort((a,b)=>a.score-b.score)[0];\n    const summaryTxt = \"Your bearing is furthest off course in \\u201c\"+off.name.toLowerCase()+\"\\u201d. That's the most useful place to aim a small, doable step — not the strongest direction, the one your values are furthest from.\";\n\n    const nm=s.name.trim(), dt=s.date.trim();\n    const prMeta = (nm?nm+\"  ·  \":\"\") + dt + \"  ·  overall bearing \"+pct+\"% on course\";\n    const prList = s.domains.map(d=>({ hex:d.hex, name:d.name, value:d.value, hasValue:!!d.value, noValue:!d.value, score:d.score, step:d.step, hasStep:!!d.step }));\n\n    return {\n      name:s.name, date:s.date, onName:this.setTop(\"name\"), onDate:this.setTop(\"date\"),\n      showGuide: this.props.showGuide !== false, guideOpen:s.guideOpen, onGuideToggle:this.onGuideToggle,\n      chevronStyle: \"margin-left:auto;display:flex;transform:rotate(\"+(s.guideOpen?180:0)+\"deg)\",\n      compassRef:this.compassRef, onCompassClick:this.onCompassClick,\n      ticks, rings, roseStar, spokes, markers, labels,\n      domains, addDisabled, addStyle, addLabel, onAdd:this.addDomain,\n      pct, summaryTxt, onPrint:this.onPrint, onReset:this.onReset,\n      prMeta, prList\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
