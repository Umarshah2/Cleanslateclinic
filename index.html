<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Slate Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F6F1E7;
      color: #2A2622;
      padding: 32px 20px;
    }
    main {
      width: 100%;
      max-width: 760px;
      background: #FBF8F1;
      border: 1px solid #E0D7C6;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(42,38,34,.08);
    }
    p.eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: #6B635A;
    }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 5vw, 48px); line-height: 1.05; }
    p { font-size: 16px; color: #6B635A; line-height: 1.6; }
    .cards { display: grid; gap: 14px; margin-top: 26px; }
    a {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      border: 1px solid #E0D7C6;
      background: #fff;
      color: #2A2622;
      text-decoration: none;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(42,38,34,.08); }
    span { display: block; margin-top: 4px; font-weight: 400; color: #6B635A; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Clean Slate</p>
    <h1>Values Tools</h1>
    <p>Select one of the tools below.</p>
    <div class="cards">
      <a href="values-card-sort.html">Values Card Sort <span>Open the interactive values sorting exercise.</span></a>
      <a href="values-compass.html">Values Compass <span>Open the bundled Values Compass page.</span></a>
    </div>
  </main>
</body>
</html>
